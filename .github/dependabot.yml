# Keep tooling and CI actions current; runtime dependencies use lower bounds.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      frontend-tooling: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
